name: CI

# The checks that would actually catch a regression.
#
# Deliberately not a lint-and-coverage pipeline. The failures that have hurt
# this project were structural -- a ranking that ignored road distance, an
# allocator that could hand out a duplicate incident reference, a map that drew
# no labels -- and every one of them was caught by an assertion about behaviour
# rather than by a style rule. So CI runs the behavioural suites and the
# typecheck, and nothing else.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — API, matching, trust, routing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the test suite
        # The suite seeds its own database at a temp path and disables the
        # simulator, so it is order-independent and needs no services.
        run: python3 -m pytest tests -q

  frontend:
    name: Frontend — typecheck and web export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Export the web build
        # Exported *without* a Maps key on purpose. This is the build that ships
        # by default, and asserting it produces no bundle containing an API key
        # is the check that catches a key leaking from the environment into a
        # public artefact.
        run: npx expo export --platform web --clear

      - name: Assert no API key is baked into the bundle
        run: |
          if grep -rl "AIzaSy" dist/_expo/static/js/web/ 2>/dev/null; then
            echo "::error::A Google Maps API key was inlined into the public web bundle."
            echo "EXPO_PUBLIC_* variables are inlined at build time and are readable"
            echo "by anyone who loads the page. Keys belong in the server environment."
            exit 1
          fi
          echo "no key in the bundle"

  browser:
    name: Browser — every surface, both viewports
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend and start it
        working-directory: backend
        run: |
          pip install -r requirements.txt
          nohup python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            --log-level warning > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/api/v1/hospitals > /dev/null; then
              echo "API up"; break
            fi
            sleep 1
          done

      - name: Build and serve the frontend
        run: |
          cd mobile
          npm ci
          npx expo export --platform web --clear
          cd ..
          nohup node tools/preview-server.mjs > /tmp/preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/ > /dev/null; then
              echo "preview up"; break
            fi
            sleep 1
          done

      - name: Install the harness
        working-directory: tools/qa
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Sweep every route at both viewports
        working-directory: tools/qa
        run: node sweep.mjs

      - name: Verify the role-scoped surfaces
        working-directory: tools/qa
        run: node surfaces.mjs

      - name: Verify the Google Maps integration
        working-directory: tools/qa
        run: node maps.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/shots/
          retention-days: 14
